name: jja-dev-labs

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: jja_dev_labs_app
    init: true
    command: sleep infinity
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: "mysql://jja:jja@db:3306/jja_dev_labs?serverVersion=10.11-MariaDB&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=1"
      MAILER_DSN: "smtp://mailpit:1025"
    volumes:
      - ..:/workspace:cached
      - composer-cache:/home/vscode/.composer/cache
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - jja_network

  db:
    image: mariadb:10.11
    container_name: jja_dev_labs_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: jja_dev_labs
      MARIADB_USER: jja
      MARIADB_PASSWORD: jja
      MARIADB_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jja_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: jja_dev_labs_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - jja_network

volumes:
  mariadb-data:
  composer-cache:

networks:
  jja_network:
    driver: bridge